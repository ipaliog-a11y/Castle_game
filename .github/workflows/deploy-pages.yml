name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the publish step writes, and it writes solely to the gh-pages branch.
permissions:
  contents: write

# A superseded deploy is never worth finishing.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Playwright is a devDependency used only by the browser playthrough;
        # its postinstall would otherwise pull ~300 MB of browsers CI never runs.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Test the structural solver
        run: npm test

      # Also typechecks — `npm run build` runs tsc --noEmit first.
      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Stop Pages running Jekyll over the bundle.
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} to Pages"
          # The branch holds only build output, so replacing it wholesale is correct.
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
