<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No `viewport-fit=cover`: the browser then keeps the viewport inside the
      safe area on its own, so the HUD never slides under a notch or a home
      indicator. The bars it leaves are the same colour as the game.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Siege &amp; Stone</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2310131c'/%3E%3Cpath d='M2 6h2V4h2v2h4V4h2v2h2v7H2z' fill='%238d949e'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #10131c;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        /* Stop mobile browsers hijacking drags meant for aiming the cannon. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /*
        The stage covers the visible viewport; src/core/viewport.ts then sets
        exact pixel sizes from `visualViewport`. These values are only what is
        shown before that first measurement lands.
      */
      #stage {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        /* Excludes the collapsing address bar where it is supported. */
        height: 100dvh;
        overflow: hidden;
      }
      /* Sized and, on portrait screens, rotated a quarter turn by the script. */
      #game {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-4MtqtsDB.js"></script>
  </head>
  <body>
    <div id="stage"><div id="game"></div></div>
  </body>
</html>
